<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Tutor</title>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f13;
    --surface: #1a1a24;
    --surface2: #22222e;
    --border: rgba(255,255,255,0.07);
    --accent: #7c6bff;
    --accent-soft: rgba(124,107,255,0.15);
    --accent2: #4ecdc4;
    --text: #e8e8f0;
    --text-muted: #8888aa;
    --text-dim: #555570;
    --green: #4ade80;
    --green-soft: rgba(74,222,128,0.12);
    --user-bg: #2a2438;
    --ai-bg: #1e1e2a;
  }

  body {
    font-family: 'Geologica', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 32px; height: 32px;
    background: var(--accent-soft);
    border-radius: 8px;
    border: 1px solid rgba(124,107,255,0.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }

  .logo-text {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
  }

  .logo-sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 1px;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #555;
    transition: background 0.3s;
  }
  .status-dot.connected { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .status-dot.connecting { background: #f59e0b; animation: pulse 1s infinite; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* Words panel */
  .words-panel {
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    min-height: 44px;
  }

  .words-label {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
    font-weight: 500;
  }

  .words-list {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .word-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 3px 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--accent2);
    animation: fadeIn 0.3s ease;
  }

  .word-tag.new {
    border-color: rgba(78,205,196,0.4);
    background: rgba(78,205,196,0.08);
  }

  @keyframes fadeIn { from{opacity:0;transform:scale(0.9)} to{opacity:1;transform:scale(1)} }

  /* Chat area */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  .chat::-webkit-scrollbar { width: 4px; }
  .chat::-webkit-scrollbar-track { background: transparent; }
  .chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .message {
    display: flex;
    gap: 10px;
    animation: slideIn 0.25s ease;
    max-width: 88%;
  }

  @keyframes slideIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

  .message.user { align-self: flex-end; flex-direction: row-reverse; }
  .message.ai { align-self: flex-start; }

  .avatar {
    width: 30px; height: 30px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .message.user .avatar {
    background: var(--accent-soft);
    border: 1px solid rgba(124,107,255,0.25);
    color: var(--accent);
  }

  .message.ai .avatar {
    background: rgba(78,205,196,0.1);
    border: 1px solid rgba(78,205,196,0.2);
    color: var(--accent2);
  }

  .bubble {
    padding: 11px 15px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.65;
    white-space: pre-wrap;
  }

  .message.user .bubble {
    background: var(--user-bg);
    border: 1px solid rgba(124,107,255,0.2);
    border-radius: 12px 4px 12px 12px;
    color: var(--text);
  }

  .message.ai .bubble {
    background: var(--ai-bg);
    border: 1px solid var(--border);
    border-radius: 4px 12px 12px 12px;
    color: var(--text);
  }

  /* Highlight english words in AI bubbles */
  .en-word {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--accent2);
    background: rgba(78,205,196,0.08);
    padding: 1px 4px;
    border-radius: 3px;
  }

  /* Typing indicator */
  .typing {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 12px 15px;
  }

  .typing span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: bounce 1.2s infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

  /* Input area */
  .input-area {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  textarea {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Geologica', sans-serif;
    font-size: 14px;
    padding: 10px 14px;
    resize: none;
    outline: none;
    min-height: 42px;
    max-height: 120px;
    transition: border-color 0.2s;
    line-height: 1.5;
  }

  textarea::placeholder { color: var(--text-dim); }
  textarea:focus { border-color: rgba(124,107,255,0.4); }

  .send-btn {
    width: 42px; height: 42px;
    border-radius: 10px;
    background: var(--accent);
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: white;
    transition: opacity 0.2s, transform 0.1s;
    flex-shrink: 0;
  }

  .send-btn:hover { opacity: 0.85; }
  .send-btn:active { transform: scale(0.95); }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .send-btn svg { width: 18px; height: 18px; }

  /* Hint chips */
  .hints {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }

  .hint-chip {
    font-size: 12px;
    padding: 4px 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
  }

  .hint-chip:hover {
    border-color: rgba(124,107,255,0.3);
    color: var(--text);
    background: var(--accent-soft);
  }

  .words-empty {
    font-size: 12px;
    color: var(--text-dim);
    font-style: italic;
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">🇬🇧</div>
    <div>
      <div class="logo-text">English Tutor</div>
      <div class="logo-sub">разговорный английский</div>
    </div>
  </div>
  <div id="status" class="status-dot connecting" title="Подключение..."></div>
</div>

<div class="words-panel">
  <div class="words-label">Изучено слов</div>
  <div class="words-list" id="wordsList">
    <span class="words-empty">слова появятся в ходе урока</span>
  </div>
</div>

<div class="chat" id="chat"></div>

<div class="input-area">
  <div style="flex:1; display:flex; flex-direction:column; gap:8px;">
    <div class="hints" id="hints">
      <span class="hint-chip" onclick="useHint(this)">Привет! Хочу учить английский</span>
      <span class="hint-chip" onclick="useHint(this)">Не понял, объясни ещё раз</span>
      <span class="hint-chip" onclick="useHint(this)">Дай мне следующее слово</span>
    </div>
    <div style="display:flex;gap:10px;align-items:flex-end;">
      <textarea id="input" placeholder="Напиши что-нибудь..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
const WS_URL = "wss://rely-mobility-fraternal.ngrok-free.dev/ws";

let ws, learnedWords = [], isTyping = false;

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const statusDot = document.getElementById("status");
const wordsList = document.getElementById("wordsList");

function connect() {
  statusDot.className = "status-dot connecting";
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    statusDot.className = "status-dot connected";
    sendBtn.disabled = false;
  };

  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    removeTyping();
    addMessage("ai", data.response);
    
    if (data.learned_words && data.learned_words.length > 0) {
      updateWords(data.learned_words, data.new_words || []);
    }
  };

  ws.onclose = () => {
    statusDot.className = "status-dot";
    sendBtn.disabled = true;
    setTimeout(connect, 3000);
  };

  ws.onerror = () => ws.close();
}

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = `message ${role}`;
  
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "Я" : "AI";
  
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = formatText(text);
  
  div.appendChild(avatar);
  div.appendChild(bubble);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function formatText(text) {
  // Highlight quoted English text
  return text.replace(/"([a-zA-Z][^"]*?)"/g, '<span class="en-word">"$1"</span>');
}

function showTyping() {
  if (isTyping) return;
  isTyping = true;
  const div = document.createElement("div");
  div.className = "message ai";
  div.id = "typing-indicator";
  div.innerHTML = `
    <div class="avatar">AI</div>
    <div class="bubble typing">
      <span></span><span></span><span></span>
    </div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  isTyping = false;
  const el = document.getElementById("typing-indicator");
  if (el) el.remove();
}

function updateWords(words, newWords) {
  learnedWords = words;
  wordsList.innerHTML = "";
  if (words.length === 0) {
    wordsList.innerHTML = '<span class="words-empty">слова появятся в ходе урока</span>';
    return;
  }
  words.forEach(w => {
    const tag = document.createElement("span");
    tag.className = "word-tag" + (newWords.includes(w) ? " new" : "");
    tag.textContent = w;
    wordsList.appendChild(tag);
  });
}

function sendMessage() {
  const text = input.value.trim();
  if (!text || !ws || ws.readyState !== 1) return;
  
  addMessage("user", text);
  showTyping();
  ws.send(JSON.stringify({ text }));
  input.value = "";
  input.style.height = "42px";
}

function useHint(el) {
  input.value = el.textContent;
  input.focus();
}

// Auto-resize textarea
input.addEventListener("input", () => {
  input.style.height = "42px";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

connect();
</script>
</body>
</html>
